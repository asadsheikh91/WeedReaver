<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
  <title id="t">WeedReaver architecture</title>
  <desc id="d">The web dashboard decides, the field app observes, and the FastAPI backend settles sync by ownership. Flights flow through photogrammetry, segmentation and zoning.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9z" fill="#566459"/>
    </marker>
    <marker id="arrW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9z" fill="#C9983D"/>
    </marker>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1B2A21" flood-opacity=".16"/>
    </filter>
  </defs>
  <style>
    .sans{font-family:Inter,'Segoe UI',system-ui,sans-serif}
    .serif{font-family:Fraunces,Georgia,'Times New Roman',serif}
    .mono{font-family:'JetBrains Mono',ui-monospace,Consolas,monospace}
  </style>

  <rect width="1200" height="520" rx="28" fill="#F5F0E6"/>
  <rect x="1" y="1" width="1198" height="518" rx="27" fill="none" stroke="#E6DCCB" stroke-width="2"/>

  <!-- Web dashboard -->
  <g filter="url(#sh)">
    <rect x="48" y="52" width="300" height="190" rx="22" fill="#FFFCF6" stroke="#E6DCCB"/>
    <rect x="48" y="52" width="300" height="52" rx="22" fill="#1E4A33"/>
    <rect x="48" y="82" width="300" height="22" fill="#1E4A33"/>
  </g>
  <text x="72" y="86" class="serif" font-size="22" fill="#F5F0E6">Web dashboard</text>
  <text x="324" y="86" class="sans" font-size="12" font-weight="700" fill="#DCE6D2" text-anchor="end" letter-spacing="1.5">DECIDES</text>
  <g class="sans" font-size="15" fill="#1B2A21">
    <text x="72" y="134">Boundaries &amp; fields</text>
    <text x="72" y="160">Prescription threshold</text>
    <text x="72" y="186">Flights &amp; review queue</text>
    <text x="72" y="212">Exports · rotation · verification</text>
  </g>
  <text x="72" y="233" class="mono" font-size="11" fill="#8B9387">React 19 · Vite · TypeScript</text>

  <!-- Field app -->
  <g filter="url(#sh)">
    <rect x="852" y="52" width="300" height="190" rx="22" fill="#FFFCF6" stroke="#E6DCCB"/>
    <rect x="852" y="52" width="300" height="52" rx="22" fill="#C9983D"/>
    <rect x="852" y="82" width="300" height="22" fill="#C9983D"/>
  </g>
  <text x="876" y="86" class="serif" font-size="22" fill="#143524">Field app</text>
  <text x="1128" y="86" class="sans" font-size="12" font-weight="700" fill="#143524" text-anchor="end" letter-spacing="1.5">OBSERVES</text>
  <g class="sans" font-size="15" fill="#1B2A21">
    <text x="876" y="134">Leaf scans &amp; abstentions</text>
    <text x="876" y="160">Zones treated, route walked</text>
    <text x="876" y="186">Product &amp; dose as labelled</text>
    <text x="876" y="212">Verification quadrats</text>
  </g>
  <text x="876" y="233" class="mono" font-size="11" fill="#8B9387">Offline-first · syncs with signal</text>

  <!-- API -->
  <g filter="url(#sh)">
    <rect x="430" y="40" width="340" height="214" rx="26" fill="#143524"/>
  </g>
  <text x="600" y="86" class="serif" font-size="26" fill="#F5F0E6" text-anchor="middle">WeedReaver API</text>
  <text x="600" y="110" class="sans" font-size="12" fill="#DCE6D2" text-anchor="middle" letter-spacing="1.5">FASTAPI · SQLALCHEMY 2 · ALEMBIC</text>
  <g class="sans" font-size="14" fill="#F5F0E6" text-anchor="middle">
    <rect x="456" y="130" width="140" height="34" rx="17" fill="#2D6547"/><text x="526" y="152">Auth &amp; roles</text>
    <rect x="604" y="130" width="140" height="34" rx="17" fill="#2D6547"/><text x="674" y="152">Offline sync</text>
    <rect x="456" y="172" width="140" height="34" rx="17" fill="#2D6547"/><text x="526" y="194">Grid &amp; zones</text>
    <rect x="604" y="172" width="140" height="34" rx="17" fill="#2D6547"/><text x="674" y="194">Exports</text>
  </g>
  <text x="600" y="238" class="mono" font-size="11" fill="#C9983D" text-anchor="middle">ownership rules, never last-write-wins</text>

  <!-- connections -->
  <path d="M350 130 H428" stroke="#566459" stroke-width="2.5" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <path d="M772 130 H850" stroke="#566459" stroke-width="2.5" fill="none" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="389" y="120" class="mono" font-size="11" fill="#566459" text-anchor="middle">REST</text>
  <text x="811" y="120" class="mono" font-size="11" fill="#566459" text-anchor="middle">sync</text>

  <!-- pipeline -->
  <text x="48" y="318" class="sans" font-size="12" font-weight="700" fill="#566459" letter-spacing="2">PROCESSING PIPELINE · DATABASE-BACKED JOBS, SURVIVE RESTARTS</text>
  <path d="M600 254 V292" stroke="#C9983D" stroke-width="2.5" fill="none" stroke-dasharray="5 5" marker-end="url(#arrW)"/>

  <g class="sans" text-anchor="middle">
    <g filter="url(#sh)">
      <rect x="48" y="340" width="190" height="110" rx="18" fill="#FFFCF6" stroke="#E6DCCB"/>
    </g>
    <text x="143" y="376" font-size="12" font-weight="700" fill="#7A5414" letter-spacing="1.5">1 · FLIGHT</text>
    <text x="143" y="404" font-size="16" fill="#1B2A21">Drone images</text>
    <text x="143" y="428" font-size="12" fill="#566459">upload · batches · zip</text>

    <g filter="url(#sh)">
      <rect x="290" y="340" width="190" height="110" rx="18" fill="#FFFCF6" stroke="#E6DCCB"/>
    </g>
    <text x="385" y="376" font-size="12" font-weight="700" fill="#7A5414" letter-spacing="1.5">2 · PHOTOGRAMMETRY</text>
    <text x="385" y="404" font-size="16" fill="#1B2A21">OpenDroneMap</text>
    <text x="385" y="428" font-size="12" fill="#566459">NodeODM → GeoTIFF</text>

    <g filter="url(#sh)">
      <rect x="532" y="340" width="190" height="110" rx="18" fill="#FFFCF6" stroke="#E6DCCB"/>
    </g>
    <text x="627" y="376" font-size="12" font-weight="700" fill="#7A5414" letter-spacing="1.5">3 · SEGMENTATION</text>
    <text x="627" y="404" font-size="16" fill="#1B2A21">Weed-cover model</text>
    <text x="627" y="428" font-size="12" fill="#566459">cover · class · confidence</text>

    <g filter="url(#sh)">
      <rect x="774" y="340" width="190" height="110" rx="18" fill="#FFFCF6" stroke="#E6DCCB"/>
    </g>
    <text x="869" y="376" font-size="12" font-weight="700" fill="#7A5414" letter-spacing="1.5">4 · ZONING</text>
    <text x="869" y="404" font-size="16" fill="#1B2A21">1 / 2 / 5 m grid</text>
    <text x="869" y="428" font-size="12" fill="#566459">zones · abstention · route</text>

    <g filter="url(#sh)">
      <rect x="1006" y="340" width="146" height="110" rx="18" fill="#1E4A33"/>
    </g>
    <text x="1079" y="376" font-size="12" font-weight="700" fill="#DCE6D2" letter-spacing="1.5">5 · PUBLISH</text>
    <text x="1079" y="404" font-size="16" fill="#F5F0E6">Spray plan</text>
    <text x="1079" y="428" font-size="12" fill="#C9D8BD">to every phone</text>
  </g>
  <g stroke="#566459" stroke-width="2.5" fill="none" marker-end="url(#arr)">
    <path d="M240 395 H288"/><path d="M482 395 H530"/><path d="M724 395 H772"/><path d="M966 395 H1004"/>
  </g>

  <text x="600" y="492" class="serif" font-size="17" font-style="italic" fill="#566459" text-anchor="middle">The web decides. The phone does.</text>
</svg>
